<!doctype html><html lang="en"><title>Run Rank parser checks</title><h1>Run Rank parser checks</h1><pre id="result">Running…</pre><script type="module">import {parseGPX} from './tracker.mjs';import {validateRun} from './engine.mjs';const xml="<?xml version=\"1.0\"?><gpx version=\"1.1\" creator=\"Run Rank test\" xmlns=\"http://www.topografix.com/GPX/1/1\"><trk><name>GPX test route</name><trkseg><trkpt lat=\"25.0\" lon=\"121.0\"><time>2026-10-28T01:00:00Z</time></trkpt><trkpt lat=\"25.001\" lon=\"121.0\"><time>2026-10-28T01:01:00Z</time></trkpt><trkpt lat=\"25.001\" lon=\"121.001\"><time>2026-10-28T01:02:00Z</time></trkpt></trkseg><trkseg><trkpt lat=\"25.01\" lon=\"121.01\"><time>2026-10-28T01:10:00Z</time></trkpt><trkpt lat=\"25.011\" lon=\"121.01\"><time>2026-10-28T01:11:00Z</time></trkpt></trkseg></trk></gpx>";const out=[];try{const result=parseGPX(xml);if(result.durationSec!==180)throw Error('Segment timing failed');if(result.distanceKm<0.32||result.distanceKm>0.33)throw Error('Distance bridged the segment gap');validateRun({...result,id:'test'});out.push('PASS: timed GPX import, 5 points, 2 segments, 180 seconds, '+result.distanceKm.toFixed(3)+' km');for(const [name,text] of [['missing timestamps',xml.replaceAll(/<time>.*?<\/time>/g,'')],['malformed XML','<gpx><trk>'],['invalid date',xml.replace('2026-10-28T01:00:00Z','2026-02-30T01:00:00Z')]]){let rejected=false;try{parseGPX(text)}catch{rejected=true}if(!rejected)throw Error(name+' accepted');out.push('PASS: '+name+' rejected');}document.querySelector('#result').textContent=out.join('\n');}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}</script></html>
